name: TestIMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: testimsregistry.azurecr.io
  IMAGE_NAME: testims-web

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore IMS/IMS.sln

      - name: Build solution
        run: dotnet build IMS/IMS.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test IMS/IMSUntTest/IMSUntTest.csproj --no-build --configuration Release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name testimsregistry

      - name: Build Docker image
        run: docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -f IMS/Dockerfile IMS

      - name: Push Docker image to ACR
        run: docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}